name: Issue Triage Agent

# This workflow never talks to GCP. WIF pool creation is blocked by org
# policy and static GCP SA keys aren't to be created either, so instead of
# authenticating to GCP, we just drop a trigger file on the `issue-triage`
# branch using the workflow's own ambient token. That push fires the
# issue-triage-agent Cloud Build trigger (infra-cloudrun), which does the
# actual work using its own already-trusted GCP identity and posts the
# comment itself. See infra-cloudrun/modules/issue-triage-agent.

on:
  issues:
    types: [labeled]

permissions:
  contents: write

jobs:
  relay:
    name: Relay issue to Cloud Build
    runs-on: ubuntu-latest
    if: github.event.label.name == 'needs-triage'
    steps:
      - name: Push trigger file to issue-triage branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "issue-triage";
            const path = ".trigger/issue.json";

            const { data: repoInfo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { data: base } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repoInfo.default_branch,
            });

            // Force issue-triage to exactly match the default branch's current
            // HEAD before adding the trigger file. Without this, the branch
            // (and everything Cloud Build reads from its checkout - the
            // script, the kb/ tree) stays frozen at whatever commit first
            // created it, silently drifting from main forever after.
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
                sha: base.commit.sha,
                force: true,
              });
            } catch (err) {
              if (err.status !== 404 && err.status !== 422) throw err;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: base.commit.sha,
              });
            }

            // The branch was just reset to main's tip, so the trigger file
            // normally won't exist there - but look up its sha defensively
            // in case a concurrent run's push landed first.
            let existingSha;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              existingSha = existing.sha;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            const payload = {
              repo: `${context.repo.owner}/${context.repo.repo}`,
              issue_number: context.payload.issue.number,
              issue_title: context.payload.issue.title,
              issue_body: context.payload.issue.body || "",
            };

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Trigger issue triage for #${payload.issue_number}`,
              content: Buffer.from(JSON.stringify(payload, null, 2)).toString("base64"),
              sha: existingSha,
            });

steps:
  - name: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --no-cache-dir -r scripts/requirements.txt
        python scripts/issue_triage.py .trigger/issue.json
    secretEnv:
      - FUELIX_API_KEY
      - GITHUB_TOKEN

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/issue-triage-agent-fuelix-api-key/versions/latest
      env: FUELIX_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/issue-triage-agent-github-token/versions/latest
      env: GITHUB_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
